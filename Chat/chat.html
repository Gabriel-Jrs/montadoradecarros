<!DOCTYPE html>
<html lang="pt-br">

<link rel="stylesheet" href="chat.css">
</head>
<body>
<header class="topo">
<div class="logo">
  <img src="logo.png" alt="Vellosci" class="logo-img">
  <span class="logo-text">VELLOSCI</span>
</div>
<nav>
<a href="#">Sobre</a>
<a href="#">Vendas</a>

<h1 class="titulo">FAÇA SUA PERGUNTA!</h1>


<section class="chat-container">

<div id="chat-area" class="chat-area"></div>


<div class="chat-input">

<footer class="rodape">

            <img src="logo.png" class="rodape-logo-img" alt="Logo Vellosci">

        </div>

        <div class="rodape-name">
            Todos os direitos reservados ©
        </div>
    </div>
